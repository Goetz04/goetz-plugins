name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and metadata (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Guard and script tests
        run: python -m unittest discover tests -v
      - name: Metadata consistency
        run: python scripts/check_metadata.py

  validate:
    name: Validate plugin manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Validate lowkey plugin
        run: claude plugin validate plugins/lowkey --strict
